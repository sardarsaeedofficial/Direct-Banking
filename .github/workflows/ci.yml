name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Prisma reads env("DATABASE_URL") when validating/generating. No database
      # is contacted by validate/generate/typecheck/build/unit-tests, so a dummy
      # value is sufficient for CI. Real credentials live only in deployment.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      SESSION_SECRET: "ci-placeholder-secret-value-000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm -r typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm -r test
